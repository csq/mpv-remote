{% extends 'base.html' %}

{% block title %}
<title>Bookmarks</title>
{% endblock %}

{% block head_content %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pages/bookmark/bookmark.css') }}">
{% endblock %}

{% block body_content %}
<h2>Bookmarks</h2>
<div class="controls-container">
  <button onclick="go_to_back()" class="btn-back">
    <i class="icon fas fa-angle-left"></i>Back
  </button>
  <input class="search-input" type="text" id="searchInput" placeholder="Search by name" oninput="filterTable()">
  <button onclick="redirect_to_add_bookmark()" class="btn-success btn-sm">
    Add Bookmark <i class="fas fa-bookmark"></i>
  </button>
</div>
<table id="bookmarkTable">
    <thead>
        <tr>
            <th>NAME</th>
            <th class="stream-url">STREAM URL</th>
            <th>ACTIONS</th>
        </tr>
    </thead>
    <tbody id="bookmarkList">
        {% for item in data %}    
            <tr>              
                <td class="stream-name">{{ item[1] }}</td>
                <td class="stream-url">{{ item[2] }}</td>
                <td class="action-cell">
                    <!-- Buttons visible on large screens -->
                    <div class="buttons-desktop">
                        <div class="bookmark-item" data-bookmark-id="{{ item[0] }}">
                            <button onclick="confirm_remove_bookmark('{{ item[0] }}');" class="btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                            <button onclick="edit_bookmark('{{ item[0] }}')" class="btn-warning btn-sm"><i class="fas fa-pencil-alt"></i></button>
                            <button data-name="{{ item[1] }}" data-path="{{ item[2] }}" class="btn-primary btn-sm btn-play"><i class="fas fa-play"></i></button>
                            <button data-name="{{ item[1] }}" data-path="{{ item[2] }}" class="btn-secondary btn-sm btn-add-playlist"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>

                    <!-- Menu toggle visible on small screens -->
                    <button class="btn-menu-toggle" data-item-id="{{ loop.index }}">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>

                    <!-- Dropdown menu for small screens -->
                    <div class="action-menu" id="menu-{{ loop.index }}">
                        <button class="menu-item btn-play" data-name="{{ item[1] }}" data-path="{{ item[2] }}">
                            <i class="fas fa-play"></i> Play
                        </button>
                        <button class="menu-item btn-edit" onclick="edit_bookmark('{{ item[0] }}')">
                            <i class="fas fa-pencil-alt"></i> Edit
                        </button>
                        <button class="menu-item btn-delete" onclick="confirm_remove_bookmark('{{ item[0] }}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                        <button class="menu-item btn-add-playlist" data-name="{{ item[1] }}" data-path="{{ item[2] }}">
                            <i class="fas fa-plus"></i> Add to Playlist
                        </button>
                    </div>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    function go_to_back() {
        window.location.href = '/';
    }

    function redirect_to_add_bookmark() {
        window.location.href = '/bookmark/add';
    }

    function remove_bookmark(bookmark_id) {
        fetch(`/bookmark/delete/${bookmark_id}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            console.log('bookmark removed successfully');
            return response.json();
        })
        .then(data => {
            const bookmarkItem = document.querySelector(`tr [data-bookmark-id="${bookmark_id}"]`).closest('tr');
            if (bookmarkItem) {
                bookmarkItem.remove();
            }
        })
        .catch(error => {
            console.error('Error removing bookmark:', error);
        });
    }

    function confirm_remove_bookmark(bookmark_id) {
        if (confirm("Are you sure you want to remove this bookmark?")) {
            remove_bookmark(bookmark_id);
        } else {
            console.log("bookmark removal cancelled.");
        }
    }

    function edit_bookmark(bookmark_id) {
        window.location.href = `/bookmark/edit/${bookmark_id}`;
    }

    function play_bookmark(name, path) {
        const encodedPath = path.includes('http') ? encodeURIComponent(path) : path;

        showModalAndHideAfterDelay("Playing bookmark: " + name, 1000);

        fetch(`/bookmark/play/${encodedPath}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('bookmark play successful:', data);
        })
        .catch(error => {
            console.error('Error playing bookmark:', error);
        });
    }

    function add_to_playlist(name, path) {
        const encodedPath = path.includes('http') ? encodeURIComponent(path) : path;

        showModalAndHideAfterDelay("Added to playlist: " + name, 1000);

        fetch(`/playlist/add/${encodedPath}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('bookmark added to playlist successful:', data);
        })
        .catch(error => {
            console.error('Error adding bookmark to playlist:', error);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Handle menu toggle
        document.querySelectorAll('.btn-menu-toggle').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const itemId = this.dataset.itemId;
                const menu = document.getElementById('menu-' + itemId);

                // Close other open menus
                document.querySelectorAll('.action-menu.active').forEach(m => {
                    if (m !== menu) m.classList.remove('active');
                });

                // Toggle current menu
                menu.classList.toggle('active');
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.action-cell')) {
                document.querySelectorAll('.action-menu.active').forEach(menu => {
                    menu.classList.remove('active');
                });
            }
        });

        document.querySelectorAll('.btn-play').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                const path = this.dataset.path;
                if (document.querySelector('.action-menu.active')) {
                    document.querySelector('.action-menu.active').classList.remove('active');
                }
                play_bookmark(name, path);
            });
        });

        document.querySelectorAll('.btn-add-playlist').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                const path = this.dataset.path;
                if (document.querySelector('.action-menu.active')) {
                    document.querySelector('.action-menu.active').classList.remove('active');
                }
                add_to_playlist(name, path);
            });
        });
    });

    /* Filter the table */
    function filterTable() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toUpperCase();
        const table = document.getElementById('bookmarkTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 0; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName('td')[0];
            if (td) {
                const txtValue = td.textContent || td.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = '';
                } else {
                    tr[i].style.display = 'none';
                }
            }
        }
    }
</script>
{% endblock %}
