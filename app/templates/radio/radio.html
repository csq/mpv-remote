{% extends 'base.html' %}

{% block title %}
<title>Radio</title>
{% endblock %}

{% block head_content %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pages/radio/radio.css') }}">
{% endblock %}

{% block body_content %}
<h2>Radio</h2>
<div class="controls-container">
  <button onclick="go_to_back()" class="btn-back">
    <i class="icon fas fa-angle-left"></i>Back
  </button>
  <input class="search-input" type="text" id="searchInput" placeholder="Search by name" oninput="filterTable()">
  <button onclick="redirect_to_add_radio()" class="btn-success btn-sm">
    Add Radio <i class="fas fa-radio"></i>
  </button>
</div>
<table id="radioTable">
    <thead>
        <tr>
            <th>NAME</th>
            <th class="stream-url">STREAM URL</th>
            <th>ACTIONS</th>
        </tr>
    </thead>
    <tbody id="radioList">
        {% for item in data %}    
            <tr>              
                <td>{{ item[1] }}</td>
                <td class="stream-url">{{ item[2] }}</td>
                <td class="action-cell">
                    <!-- Buttons visible on large screens -->
                    <div class="buttons-desktop">
                        <div class="radio-item" data-radio-id="{{ item[0] }}">
                            <button onclick="confirm_remove_radio('{{ item[0] }}');" class="btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                            <button onclick="edit_radio('{{ item[0] }}')" class="btn-warning btn-sm"><i class="fas fa-pencil-alt"></i></button>
                            <button data-name="{{ item[1] }}" data-path="{{ item[2] }}" class="btn-primary btn-sm btn-play"><i class="fas fa-play"></i></button>
                        </div>
                    </div>

                    <!-- Menu toggle visible on small screens -->
                    <button class="btn-menu-toggle" data-item-id="{{ loop.index }}">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>

                    <!-- Dropdown menu for small screens -->
                    <div class="action-menu" id="menu-{{ loop.index }}">
                        <button class="menu-item btn-play" data-name="{{ item[1] }}" data-path="{{ item[2] }}">
                            <i class="fas fa-play"></i> Play
                        </button>
                        <button class="menu-item btn-edit" onclick="edit_radio('{{ item[0] }}')">
                            <i class="fas fa-pencil-alt"></i> Edit
                        </button>
                        <button class="menu-item btn-delete" onclick="confirm_remove_radio('{{ item[0] }}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    function go_to_back() {
        window.location.href = '/';
    }

    function redirect_to_add_radio() {
        window.location.href = '/radio/add';
    }

    function remove_radio(radio_id) {
        fetch(`/radio/delete/${radio_id}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            console.log('Radio removed successfully');
            return response.json();
        })
        .then(data => {
            const radioItem = document.querySelector(`tr [data-radio-id="${radio_id}"]`).closest('tr');
            if (radioItem) {
                radioItem.remove();
            }
        })
        .catch(error => {
            console.error('Error removing radio:', error);
        });
    }

    function confirm_remove_radio(radio_id) {
        if (confirm("Are you sure you want to remove this radio?")) {
            remove_radio(radio_id);
        } else {
            console.log("Radio removal cancelled.");
        }
    }

    function edit_radio(radio_id) {
        window.location.href = `/radio/edit/${radio_id}`;
    }

    document.querySelectorAll('.btn-play').forEach(button => {
        button.addEventListener('click', () => {
            const name = button.getAttribute('data-name');
            const path = button.getAttribute('data-path');
            play_radio(name, path);
        });
    })

    function play_radio(name, url) {
        const encodedUrl = encodeURIComponent(url);

        showModalAndHideAfterDelay("Playing radio: " + name, 1000);

        fetch(`/radio/play/${encodedUrl}`, { 
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('Radio play successful:', data);
        })
        .catch(error => {
            console.error('Error playing radio:', error);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Handle menu toggle
        document.querySelectorAll('.btn-menu-toggle').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const itemId = this.dataset.itemId;
                const menu = document.getElementById('menu-' + itemId);

                // Close other open menus
                document.querySelectorAll('.action-menu.active').forEach(m => {
                    if (m !== menu) m.classList.remove('active');
                });

                // Toggle current menu
                menu.classList.toggle('active');
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.action-cell')) {
                document.querySelectorAll('.action-menu.active').forEach(menu => {
                    menu.classList.remove('active');
                });
            }
        });

        document.querySelectorAll('.btn-play').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                const path = this.dataset.path;
                if (document.querySelector('.action-menu.active')) {
                    document.querySelector('.action-menu.active').classList.remove('active');
                }
                play_radio(name, path);
            });
        });
    });

    /* Filter the table */
    function filterTable() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toUpperCase();
        const table = document.getElementById('radioTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 0; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName('td')[0];
            if (td) {
                const txtValue = td.textContent || td.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = '';
                } else {
                    tr[i].style.display = 'none';
                }
            }
        }
    }
</script>
{% endblock %}
