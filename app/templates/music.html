{% extends 'base.html' %}

{% block title %}
<title>Music Collection</title>
{% endblock %}

{% block head_content %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pages/music.css') }}">
{% endblock %}

{% block body_content %}
<h1>Local Music Collection</h1>
<div class="controls-container">
  <button onclick="go_to_back()" class="btn-back">
    <i class="icon fas fa-angle-left"></i>Back
  </button>
  <input class="search-input" type="text" id="searchInput" placeholder="Search by name" oninput="filterTable()">
</div>
<table id="musicTable">
    <thead>
        <tr>
            <th>NAME</th>
            <th>ACTIONS</th>
        </tr>
    </thead>
    <tbody id="musicList">
        {% for item in music_catalog %}
            <tr>
                <td>{{ item.name }}</td>
                <td class="action-cell">
                    <!-- Buttons visible on large screens -->
                    <div class="buttons-desktop">
                        <button id="btn-playlist" data-path="{{ item.path }}" title="Playlist">
                            <i class="fas fa-list"></i>
                        </button>
                        <button id="btn-bookmark" data-name="{{ item.name }}" data-path="{{ item.path }}" title="Bookmark">
                            <i class="fas fa-bookmark"></i>
                        </button>
                        <button id="btn-play" data-name="{{ item.name }}" data-path="{{ item.path }}" title="Play">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>

                    <!-- Menu toggle visible on small screens -->
                    <button class="btn-menu-toggle" data-item-id="{{ loop.index }}">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>

                    <!-- Dropdown menu for small screens -->
                    <div class="action-menu" id="menu-{{ loop.index }}">
                        <button class="menu-item btn-play" data-name="{{ item.name }}" data-path="{{ item.path }}">
                            <i class="fas fa-play"></i> Play
                        </button>
                        <button class="menu-item btn-playlist" data-path="{{ item.path }}">
                            <i class="fas fa-list"></i> Playlist
                        </button>
                        <button class="menu-item btn-bookmark" data-name="{{ item.name }}" data-path="{{ item.path }}">
                            <i class="fas fa-bookmark"></i> Bookmark
                        </button>
                    </div>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    function go_to_back() {
        window.location.href = '/';
    }

    document.querySelectorAll('#btn-play').forEach(button => {
        button.addEventListener('click', () => {
            const name = button.getAttribute('data-name');
            const path = button.getAttribute('data-path');
            play_music(name, path);
        });
    })

    function play_music(name, path) {
        showModalAndHideAfterDelay('Playing: ' + name, 1000);

        fetch(`/local/play/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ path: path })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('Local music play successful:', data);
        })
        .catch(error => {
            console.error('Error playing local music:', error);
        });
    }

    document.querySelectorAll('#btn-bookmark').forEach(button => {
        button.addEventListener('click', () => {
            const name = button.getAttribute('data-name');
            const path = button.getAttribute('data-path');
            add_bookmark(name, path);
        });
    })

    function add_bookmark(title, path) {
        showModalAndHideAfterDelay('Saved to bookmarks', 1000);

        const bookmarkData = {
            name: title,
            path: path
        };

        fetch('/bookmark/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(bookmarkData)
        })
        .then(response => response.json())
        .catch(error => console.error('Error adding bookmark:', error));
    }

    document.querySelectorAll('#btn-playlist').forEach(button => {
        button.addEventListener('click', () => {
            const path = button.getAttribute('data-path');
            view_playlist(path);
        });
    })

    function view_playlist(path) {
        const encodedPath = encodeURIComponent(path);
        fetch(`/music/playlist?path=${encodedPath}`, {method: 'GET'})
            .then(response => response.json())
            .then(data => {
                const name = path.split('/').pop();
                const headerTitle = '<h3>' + name + '</h3>';

                // Wrap each file name with the ellipsis class
                const bodyContent = data['files'].map(file => {
                    const cleanedName = file.replace(/^.*\s(\d{2}\s.*)$/, '$1');
                    return `<div class="text-ellipsis">${cleanedName}</div>`;
                }).join('');

                const buttonPlay = `<button id="playlistButton" data-path="${path}" data-name="${name}"><i class="fas fa-play"></i> Play</button>`;

                showModal(`${headerTitle}<div class="scrollable-list">${bodyContent}</div>\n\n${buttonPlay}`);

                // Add event listener after the modal is rendered
                document.getElementById('playlistButton').addEventListener('click', function() {
                    const btnName = this.getAttribute('data-name');
                    const btnPath = this.getAttribute('data-path');
                    play_music(btnName, btnPath);
                });
            })
            .catch(error => console.error('Error:', error));
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Handle menu toggle
        document.querySelectorAll('.btn-menu-toggle').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const itemId = this.dataset.itemId;
                const menu = document.getElementById('menu-' + itemId);

                // Close other open menus
                document.querySelectorAll('.action-menu.active').forEach(m => {
                    if (m !== menu) m.classList.remove('active');
                });

                // Toggle current menu
                menu.classList.toggle('active');
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.action-cell')) {
                document.querySelectorAll('.action-menu.active').forEach(menu => {
                    menu.classList.remove('active');
                });
            }
        });

        // Keep your existing button handlers - they'll work for both versions
        document.querySelectorAll('.btn-playlist').forEach(btn => {
            btn.addEventListener('click', function() {
                const path = this.dataset.path;
                if (document.querySelector('.action-menu.active')) {
                    document.querySelector('.action-menu.active').classList.remove('active');
                }
                view_playlist(path);
            });
        });

        document.querySelectorAll('.btn-bookmark').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                const path = this.dataset.path;
                if (document.querySelector('.action-menu.active')) {
                    document.querySelector('.action-menu.active').classList.remove('active');
                }
                add_bookmark(name, path);
            });
        });

        document.querySelectorAll('.btn-play').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                const path = this.dataset.path;
                if (document.querySelector('.action-menu.active')) {
                    document.querySelector('.action-menu.active').classList.remove('active');
                }
                play_music(name, path);
            });
        });
    });

    /* Filter the table */
    function filterTable() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toUpperCase();
        const table = document.getElementById('musicTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 0; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName('td')[0];
            if (td) {
                const txtValue = td.textContent || td.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = '';
                } else {
                    tr[i].style.display = 'none';
                }
            }
        }
    }
</script>
{% endblock %}
