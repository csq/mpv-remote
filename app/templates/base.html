<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% block title %}{% endblock %}
        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/base.css') }}">
        <script src="{{ url_for('static', filename='fontawesome/js/all.min.js') }}"></script>
        {% block head_content %}{% endblock %}
    </head>
    <body>
        <div class="container">
            <div id="media-display">
                <p id="media-title"></p>
            </div>

            <div id="modal" class="modal">
                <div class="modal-content">
                    <span class="modal-close">&times;</span>
                    <pre id="modal-message" style="white-space: pre-wrap; word-wrap: break-word;"></pre>
                </div>
            </div>
            {% block body_content %}{% endblock %}
        </div>
    </body>
</html>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modalElement = document.getElementById('modal');
        const closeButton = modalElement.querySelector('.modal-close');

        function showModal(message) {
            const messageElement = document.getElementById('modal-message');
            messageElement.innerHTML = message;
            modalElement.classList.add('is-visible');
        }

        function hideModal(delay = 2000) {
            setTimeout(() => {
                modalElement.classList.remove('is-visible');
            }, delay);
        }

        closeButton.addEventListener('click', hideModal);

        modalElement.addEventListener('click', (event) => {
            if (event.target === modalElement) {
                hideModal();
            }
        });

        // Expose functions to the global scope
        window.showModal = showModal;
        window.hideModal = hideModal;
    });

    // Function to open a modal and close it after a delay
    function showModalAndHideAfterDelay(message, delay) {
        showModal(message);
        setTimeout(hideModal, delay);
    }

    function updateMediaInfo() {
        if (document.visibilityState === 'visible') {
            fetch('/media-info')
                .then(response => response.json())
                .then(data => {
                    const mediaDisplay = document.getElementById('media-display');
                    const mediaTitleElement = document.getElementById('media-title');

                    if (data.is_playing) {
                        const title = data.title;
                        const metadata = data.metadata;
                        const mediaTitle = `${metadata} - ${title}`;

                        if (title.includes(metadata)) {
                            mediaTitleElement.textContent = title;
                        } else {
                            mediaTitleElement.textContent = mediaTitle;
                        }
                        mediaDisplay.style.display = 'block';
                    } else {
                        mediaDisplay.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    }

    // Update media info every 3 seconds
    setInterval(updateMediaInfo, 3000);

    // Initial update
    updateMediaInfo();
</script>
