{% extends "base.html" %}

{% block title %}
<title>MPV Remote</title>
{% endblock %}

{% block head_content %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pages/index.css') }}">
</style>
{% endblock %}

{% block body_content %}
<div id="url-form-container">
    <h2>MPV Remote</h2>
    <form id="urlForm" action="/playing" method="POST">
        <input type="url" id="urlInput" name="url" placeholder="Paste link from YouTube Music, Bandcamp, etc." required>
        <button type="submit" id="btn-submit"><i class="fas fa-paper-plane"></i> Submit</button>
    </form>
</div>

<div id="control-buttons">
    <div class="row">
        <button onclick="control('pause')" id="btn-pause" class="{% if btn_states.pause %}active{% endif %}"><i class="icon fas fa-pause"></i>Pause</button>
        <button onclick="control('stop');"><i class="icon fas fa-stop"></i>Stop</button>
        <button onclick="control('vol_plus')"><i class="icon fas fa-volume-up"></i>Vol +</button>
        <button onclick="control('mute')" id="btn-mute" class="{% if btn_states.mute %}active{% endif %}"><i class="icon fas fa-volume-mute"></i>Mute</button>
        <button onclick="control('vol_minus')"><i class="icon fas fa-volume-down"></i>Vol -</button>
    </div>
    <div class="row">
        <button onclick="control('previous')"><i class="icon fas fa-backward"></i>Prev</button>
        <button onclick="control('next')"><i class="icon fas fa-forward"></i>Next</button>
    </div>
    <div class="row">
        <button onclick="control('repeat')" id="btn-repeat" class="{% if btn_states.repeat %}active{% endif %}"><i class="icon fas fa-repeat"></i>Repeat</button>
        <button onclick="show_playlist()" id="btn-playlist"><i class="icon fas fa-list"></i>Playlist</button>
    </div>
    <div class="row">
        <button onclick="go_to_bookmark()"><i class="icon fas fa-bookmark"></i></button>
        <button onclick="go_to_radio()"><i class="icon fas fa-radio"></i></button>
        <button onclick="show_upload_form()" id="btn-upload" hidden><i class="icon fas fa-folder"></i></button>
        <button onclick="go_to_music_library()" id="btn-music" hidden><i class="icon fas fa-music"></i></button>
        <button onclick="go_to_search()" id="btn-ytmusic" hidden><i class="icon fas fa-search"></i></button>
    </div>
</div>
<form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data" hidden>
    <input type="file" name="file" id="audioFile" accept="audio/*" multiple required>
    <input type="checkbox" id="upload_folder" name="upload_folder">
    <label for="upload_folder">Add folder</label>
    <button type="submit" id="btn-upload"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
</form>
<div id="playlist">
    <h2>Playlist</h2>
    <table id="playlistTable">
        <thead>
            <tr>
                <th>#</th>
                <th>NAME</th>
                <th class="stream-url">SOURCE</th>
                <th>ACTIONS</th>
            </tr>
        </thead>
        <tbody id="playlistList">
        </tbody>
    </table>
</div>

<script>
    const btn_state = JSON.parse('{{ btn_states | tojson }}');
    const available_features = JSON.parse('{{ available_features | tojson }}');

    var btn_pressed_mute = btn_state.mute
    var btn_pressed_pause = btn_state.pause;
    var btn_pressed_repeat = btn_state.repeat;

    var btn_pressed_playlist = false;
    var btn_pressed_upload = false;

    var show_upload_button = available_features.upload_file;
    var show_ytmusic_button = available_features.ytmusic_search;
    var show_music_catalog = available_features.music_dir;

    document.getElementById('urlForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Get the URL from the input
        const url = document.getElementById('urlInput').value;

        // Clear the input
        document.getElementById('urlInput').value = '';

        // Modal stuff
        showModalAndHideAfterDelay("Playing: " + url, 3000);

        // Send the URL to the server
        fetch('/playing', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `url=${encodeURIComponent(url)}`
        })
        .then(response => {
            if (response.ok) {
                console.log('URL sent successfully');
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });

    // Show the upload button
    if (show_upload_button) {
        document.getElementById('btn-upload').hidden = false;
    };

    // Show the ytmusic button
    if (show_ytmusic_button) {
        document.getElementById('btn-ytmusic').hidden = false;
    };

    // Show the music button
    if (show_music_catalog) {
        document.getElementById('btn-music').hidden = false;
    };

    function control(action) {
        fetch(`/control/${action}`, { method: 'POST' })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));

        const button = document.getElementById(`btn-${action}`);
        if (button != null) {
            button.classList.toggle('active');
        }

        const variableName = `btn_pressed_${action}`;
        window[variableName] = !window[variableName];
    }

    function go_to_radio() {
        window.location.href = '/radio';
    }

    function go_to_bookmark() {
        window.location.href = '/bookmark';
    }

    function go_to_music_library() {
        window.location.href = '/music';
    }

    function show_playlist() {
        btn_pressed_playlist = !btn_pressed_playlist;

        const playlist_button = document.getElementById('btn-playlist');
        playlist_button.classList.toggle('active');

        if (!btn_pressed_playlist) {
            document.getElementById('playlist').style.display = 'none';
        }
        else{
            fetch('/playlist', { method: 'GET' })
                .then(response => response.json())
                .then(data => {
                    if (data.length == 0) {
                        document.getElementById('playlist').style.display = 'none';
                    }
                    else{
                        document.getElementById('playlist').style.display = 'block';
                        const tableBody = document.getElementById('playlistList');
                        // Clear existing rows
                        tableBody.innerHTML = '';
                        
                        // Populate table with new data
                        var index = 1;
                        data.forEach(item => {
                            // Get the file name without extension
                            const fileNameParts = item.filename.split('/').pop().split('.');
                            const fileName = fileNameParts.slice(0, -1).join(' ').replace(/_/g, ' ').replace(/^\d+[\s.\-]*/, '').split('-').pop();
                            const displayTitle = (item.title ? item.title : fileName ? fileName: 'Unknown').replace(/'/g, "\\'");

                            const row = `
                                <tr ${item.playing ? 'class="playing"' : ''}>
                                    <td>${(index++, item.playing ? '<i class="fas fa-volume-up"></i>' : index - 1)}</td>
                                    <td>${item.title ? item.title : fileName}</td>
                                    <td class="stream-url">${item.filename}</td>
                                    <td class="action-cell">
                                        <!-- Buttons visible on large screens -->
                                        <div class="buttons-desktop">
                                            <button onclick="delete_item_from_playlist('${index - 2}');" class="btn btn-danger btn-sm" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                            <button onclick="play_item_from_playlist('${index - 2}', '${displayTitle}');" class="btn btn-primary btn-sm" title="Play">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>

                                        <!-- Menu toggle visible on small screens -->
                                        <button class="btn-menu-toggle" data-item-id="${item.id}">
                                            <i class="fas fa-ellipsis-v"></i>
                                        </button>

                                        <!-- Dropdown menu for small screens -->
                                        <div class="action-menu" id="menu-${item.id}">
                                            <button onclick="play_item_from_playlist('${index - 2}', '${displayTitle}');" class="menu-item btn-play">
                                                <i class="fas fa-play"></i> Play
                                            </button>
                                            <button onclick="delete_item_from_playlist('${index - 2}');" class="menu-item btn-delete">
                                                <i class="fas fa-trash"></i> Delete
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                            tableBody.innerHTML += row;
                        });
                        // Initialize menu toggles after DOM is updated
                        initializeMenuToggles();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                }
            );
        }
    }

    function play_item_from_playlist(index, title) {
        fetch(`/playlist/play/${index}`, { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data == 'success') {
                    showModalAndHideAfterDelay("Playing: " + title, 3000);
                }
            })
            .catch(error => console.error('Error:', error));
    }

    function delete_item_from_playlist(index) {
        fetch(`/playlist/delete/${index}`, { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data == 'success') {
                    // Refresh playlist
                    btn_pressed_playlist = false;
                    show_playlist();
                    const pbutton = document.getElementById('btn-playlist');
                    pbutton.classList.toggle('active');
                }
            })
            .catch(error => console.error('Error:', error));
    }

    function show_upload_form() {
        const form_upload_button = document.getElementById('btn-upload');
        form_upload_button.classList.toggle('active');

        if (btn_pressed_upload == true) {
            document.getElementById('uploadForm').style.display = 'none';
            form_upload_button.innerHTML = '<i class="fas fa-folder"></i>';
            btn_pressed_upload = false;
        } else {
            document.getElementById('uploadForm').style.display = 'block';
            form_upload_button.innerHTML = '<i class="fas fa-folder-open"></i>';
            btn_pressed_upload = true;
        }
    }

    function upload() {
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData();
                formData.append('file', document.getElementById('audioFile').files[0]);

                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
            });
    }

    // Folder upload handling
    const audioFile = document.getElementById('audioFile');
    const uploadFolder = document.getElementById('upload_folder');

    uploadFolder.addEventListener('change', function() {
        if (this.checked) {
            // Enable folder upload
            audioFile.setAttribute('webkitdirectory', '');
            audioFile.setAttribute('multiple', '');
        } else {
            // Revert to file upload
            audioFile.removeAttribute('webkitdirectory');
        }
    });

    function go_to_search() {
        window.location.href = '/search';
    }

    // Watch for changes to media title if changing update playlist
    const mediaTitle = document.getElementById('media-title');
    let lastText = mediaTitle.textContent;

    const observer = new MutationObserver(() => {
        const currentText = mediaTitle.textContent;

        // Only trigger if text is DIFFERENT from last time
        if (currentText !== lastText) {
            lastText = currentText;

            if (btn_pressed_playlist) {
                btn_pressed_playlist = false;
                show_playlist();
                const pbutton = document.getElementById('btn-playlist');
                pbutton.classList.toggle('active');
            }
        }
    });

    // Start observing
    observer.observe(mediaTitle, {
        characterData: true,
        childList: true,
        subtree: true
    });

    function initializeMenuToggles() {
        // Handle menu toggle
        document.querySelectorAll('.btn-menu-toggle').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const itemId = this.dataset.itemId;
                const menu = document.getElementById('menu-' + itemId);

                // Close other open menus
                document.querySelectorAll('.action-menu.active').forEach(m => {
                    if (m !== menu) m.classList.remove('active');
                });

                // Toggle current menu
                menu.classList.toggle('active');
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.action-cell')) {
                document.querySelectorAll('.action-menu.active').forEach(menu => {
                    menu.classList.remove('active');
                });
            }
        });
    }

    initializeMenuToggles();

</script>
{% endblock %}
