[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpv-remote"
version = "0.1.1"
description = "Flask-based web interface for controlling MPV media player"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "Flask==3.1.2",
    "platformdirs==4.5.1",
    "ytmusicapi==1.11.5",
]

[project.scripts]
mpv-remote = "mpv_remote:main"

[project.urls]
Homepage = "https://github.com/csq/mpv-remote"
Repository = "https://github.com/csq/mpv-remote"
Issues = "https://github.com/csq/mpv-remote/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mpv_remote*"]

[tool.setuptools.package-data]
"mpv_remote" = [
    "templates/**/*",
    "static/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", "*.pyo", "*.pyd", ".git", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py39"]
